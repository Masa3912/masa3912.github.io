<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tesla sign-in result</title>
<style>body{font-family:sans-serif;padding:24px;font-size:18px}#c{word-break:break-all;background:#f2f2f2;padding:12px;border-radius:8px;font-family:monospace}button{font-size:20px;padding:12px 20px;margin-top:16px}</style></head><body>
<h2>Tesla sign-in is complete</h2><p id="m">Copy the code below and paste it into the input field in the Grokbot chat.</p><div id="c"></div><button onclick="navigator.clipboard.writeText(document.getElementById('c').textContent);this.textContent='Copied'">Copy code</button>
<script>var p=new URLSearchParams(location.search);var c=p.get('code');if(c){document.getElementById('c').textContent=c}else{document.getElementById('m').textContent='Error: '+(p.get('error_description')||p.get('error')||'no code');document.querySelector('button').style.display='none'}</script></body></html>
